[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mqgt-scf"
version = "1.0.0"
description = "Merged Quantum Gauge and Scalar Consciousness Framework - Constraint Lab"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT AND CC-BY-4.0"}
authors = [
    {name = "Christopher M. Baird", email = ""}
]
keywords = [
    "quantum physics",
    "effective field theory",
    "consciousness",
    "ethics",
    "constraint analysis",
    "fifth force",
    "quantum random number generator"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "License :: Creative Commons :: Attribution CC BY 4.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/Cbaird26/MQGT-SCF"
Repository = "https://github.com/Cbaird26/MQGT-SCF"
Documentation = "https://github.com/Cbaird26/MQGT-SCF/tree/main/docs"
"Bug Tracker" = "https://github.com/Cbaird26/MQGT-SCF/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]
